[pytest]
testpaths = server/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    unit: marks tests as unit tests
    slow: marks tests as slow running
    text: Tests for text source processing
    all_strategies: Tests that cover all chunking strategies
    url: Tests for URL source processing
    scraping: Tests for web scraping functionality
    files: Tests for file processing
    pdf: Tests for PDF file processing
    docx: Tests for DOCX file processing
    xlsx: Tests for Excel file processing
    excel: Tests for Excel file processing (alias)
    html: Tests for HTML file processing
    query: Tests for query/search functionality
    search: Tests for search functionality
    replacement: Tests for document replacement
    crud: Tests for CRUD operations
    deletion: Tests for document deletion
    listing: Tests for document listing
    smart_chunking: Tests for smart chunking strategy
    chunking_strategy: Tests for chunking strategies
    faq_optimization: Tests for FAQ optimization strategy
    topic_headers: Tests for topic headers strategy
    summarize: Tests for summarization strategy
    hardcoded_text: Tests for hardcoded text processing
    polling: Tests that use inefficient polling (skip during CI/hooks)
    slow_processing: Tests with long processing times
    document_processor: Tests for document processor microservice
    microservice: Tests for microservice functionality
    file: Tests for file processing
    fallback: Tests for fallback behavior
    error_handling: Tests for error handling
    comprehensive: Tests for comprehensive functionality
    integration_flow: Tests for integration workflows
    performance: Tests for performance measurement
    production: Tests for production environment
    smoke: Tests for smoke testing
    chat: Tests for chat functionality
    mcp: Tests for MCP functionality