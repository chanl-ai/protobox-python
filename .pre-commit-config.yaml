# Pre-commit hooks for ProtoBox
# Fast checks only (<5 seconds) - formatting and basic validation
# Install with: pip install pre-commit && pre-commit install

repos:
  # General file checks (very fast)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
        files: ^server/.*\.py$
      - id: check-ast  # Python syntax check
        files: ^server/.*\.py$

  # Python formatting (auto-fix, fast)
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11
        files: ^server/.*\.py$

  # JavaScript/TypeScript formatting (auto-fix, fast)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^client/.*\.(js|jsx|ts|tsx|json|css|scss)$
        exclude: ^client/(node_modules|.next|out|logs)/
        args: ['--write']

  # Security - check for secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock\.json

# Note: Integration tests and heavy linting moved to pre-push hook
# See scripts/install-hooks.sh for complete setup