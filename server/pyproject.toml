[project]
name = "protobox-ai"
version = "0.1.0"
description = "ProtoBox AI MCP Server"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "aiohttp>=3.8.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=11.0.0",
    "tenacity>=8.0.0",
    "certifi>=2023.0.0",
    "pyyaml>=6.0.0",
    "click>=8.0.0",
    "motor>=3.3.0",
    "pymongo>=4.5.0",
    "cryptography>=41.0.0",
    "pyjwt>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
    "sse-starlette>=1.6.0",
    "fastmcp>=2.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "firebase-admin>=6.0.0",
    "boto3>=1.40.9",
    "beautifulsoup4>=4.13.4",
    "trafilatura>=2.0.0",
    "openai-agents>=0.2.6",
    "openapi3>=1.8.0",
    "pytest-asyncio>=1.1.0",
    "langchain-mongodb>=0.6.2",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "mcp>=1.13.0",
    "redis>=6.4.0",
    "python-liquid>=2.1.0",
    "cloudflare>=4.3.1",
]

[project.scripts]
protobox = "protobox.admin_cli:run"
protobox-server = "protobox.cli:main"


[tool.ruff]
# Same line length as Black
line-length = 100

# Python version target
target-version = "py311"

# Files to include
include = ["*.py", "*.pyi", "**/pyproject.toml"]

# Files to exclude
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "migrations",
    ".pytest_cache",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "T10",  # flake8-debugger (catches pdb, breakpoint)
    "T20",  # flake8-print (catches print statements)
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
]

# Rules to ignore
ignore = [
    "E501",  # Line too long (handled by formatter)
    "T201",  # Allow print in certain files (see per-file-ignores)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
# Allow print statements in scripts and CLI
"scripts/*" = ["T20"]
"src/protobox/cli.py" = ["T20"]
# Allow unused arguments in tests
"tests/*" = ["ARG", "T20"]
# Allow star imports in __init__ files
"__init__.py" = ["F403", "F401"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Unix-style line endings
line-ending = "auto"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.9",
]
