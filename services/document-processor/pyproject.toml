[project]
name = "document-processor"
version = "0.1.0"
description = "Document Processing Service for ProtoBox"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "pymupdf>=1.26.3",
    "pdfplumber>=0.11.7",
    "pytesseract>=0.3.13",
    "pillow>=11.3.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.1",
    "beautifulsoup4>=4.13.4",
    "python-multipart>=0.0.6",
    "aiofiles>=23.0.0",
    "loguru>=0.7.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]